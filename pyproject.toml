[project]
name = "football-stuff"
version = "0.1.0"
description = "Assorted football analysis (FPL optimizer, five-year club stats, etc.)"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "polars==1.42.1",
    "numpy==2.5.0",
    "scikit-learn==1.9.0",
    "matplotlib==3.11.0",
    "jupyter==1.1.1",
    "requests==2.34.2",
    "rapidfuzz",
    "unidecode",
    "pulp",
    "scipy>=1.18.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false
